<!doctype html>
<html lang="nn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Randsone</title>
  <meta name="description" content="Ei helsing frå Øyvind Løkling til lesaren av Randsone.">
  <meta name="theme-color" content="#15110e">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="nn_NO">
  <meta property="og:url" content="https://randsone.no/">
  <meta property="og:title" content="Randsone">
  <meta property="og:description" content="Ei helsing frå Øyvind Løkling til lesaren av Randsone.">
  <meta property="og:image" content="https://randsone.no/randsone-deling.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500&display=swap">

  <style>
    /* Oppsett: eit bokoppslag. Biletet til venstre, helsinga til høgre,
       og ei mjuk randsone der biletet går over i kvelden rundt. */
    :root {
      --natt: #15110e;
      --torv: #2a211b;
      --ljos: #ede3d6;
      --dempa: #b3a391;
      --gull: #d6b08a;
      --f-serif: "Cormorant Garamond", Garamond, Georgia, "Times New Roman", serif;
      --f-sans: "Figtree", "Helvetica Neue", Arial, sans-serif;
      --gutter: max(20px, env(safe-area-inset-left, 0px));
      --gutter-r: max(20px, env(safe-area-inset-right, 0px));
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html { background: var(--natt); }

    body {
      margin: 0;
      position: relative;
      overflow-x: hidden;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      color: var(--ljos);
      background: radial-gradient(120% 90% at 28% 18%, var(--torv) 0%, var(--natt) 62%);
      font-family: var(--f-serif);
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    /* Kveldsljoset frå biletet, sterkt uskarpt, som bakgrunn. */
    .ambient {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .ambient::before {
      content: "";
      position: absolute;
      inset: -15%;
      background: url("randsone-web.jpg") 30% 40% / cover no-repeat;
      filter: blur(80px) saturate(1.15);
      opacity: .22;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding-block: clamp(28px, 6vw, 88px);
      padding-left: var(--gutter);
      padding-right: var(--gutter-r);
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, .9fr);
      gap: clamp(36px, 6vw, 104px);
      align-items: center;
    }

    figure { margin: 0; }

    .cover img {
      display: block;
      width: 100%;
      height: auto;
      -webkit-mask-image:
        linear-gradient(to right, transparent 0, #000 5%, #000 95%, transparent 100%),
        linear-gradient(to bottom, transparent 0, #000 5%, #000 93%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to right, transparent 0, #000 5%, #000 95%, transparent 100%),
        linear-gradient(to bottom, transparent 0, #000 5%, #000 93%, transparent 100%);
      mask-composite: intersect;
    }

    .letter {
      position: relative;
      padding-left: clamp(24px, 3vw, 44px);
      max-width: 30rem;
    }
    .letter::before {
      content: "";
      position: absolute;
      left: 0;
      top: 4%;
      bottom: 4%;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--gull) 30%, var(--gull) 70%, transparent);
      opacity: .55;
    }

    .eyebrow {
      margin: 0 0 28px;
      font-family: var(--f-sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--gull);
    }

    .letter p { margin: 0; }
    .letter .eyebrow { margin-bottom: 28px; }
    .letter .wish { margin-top: 26px; }
    .letter .signature { margin-top: 52px; }

    .opening {
      font-size: clamp(27px, 2.7vw, 36px);
      font-weight: 500;
      line-height: 1.28;
      text-wrap: pretty;
    }

    .wish {
      font-size: clamp(23px, 2.1vw, 28px);
      font-weight: 500;
      font-style: italic;
      color: var(--ljos);
      text-wrap: balance;
    }

    .signature {
      font-size: 19px;
      color: var(--dempa);
    }
    .name {
      display: block;
      margin-top: 2px;
      font-size: 40px;
      font-style: italic;
      font-weight: 500;
      line-height: 1.1;
      color: var(--ljos);
    }

    footer {
      position: relative;
      z-index: 1;
      padding-block: 20px calc(32px + env(safe-area-inset-bottom, 0px));
      padding-left: var(--gutter);
      padding-right: var(--gutter-r);
      text-align: center;
      font-family: var(--f-sans);
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--dempa);
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: minmax(0, 1fr);
        padding-top: 0;
        gap: 8px;
        align-items: start;
      }
      .cover {
        margin-left: calc(-1 * var(--gutter));
        margin-right: calc(-1 * var(--gutter-r));
      }
      .cover img {
        -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 82%, transparent 100%);
        mask-image: linear-gradient(to bottom, #000 0, #000 82%, transparent 100%);
        -webkit-mask-composite: source-over;
        mask-composite: add;
      }
      .letter {
        padding-left: 0;
        max-width: 34rem;
        margin: 0 auto;
        text-align: center;
      }
      .letter::before {
        position: static;
        display: block;
        width: 64px;
        height: 1px;
        margin: 0 auto 26px;
        background: linear-gradient(to right, transparent, var(--gull), transparent);
      }
      .letter .eyebrow { margin-bottom: 20px; }
      .letter .signature { margin-top: 40px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .cover img { animation: mist 1.8s ease-out both; }
      .letter > * { animation: rise 1s ease-out both; }
      .letter > :nth-child(1) { animation-delay: .5s; }
      .letter > :nth-child(2) { animation-delay: .7s; }
      .letter > :nth-child(3) { animation-delay: .95s; }
      .letter > :nth-child(4) { animation-delay: 1.2s; }
      @keyframes mist {
        from { opacity: 0; filter: blur(10px); }
        to { opacity: 1; filter: blur(0); }
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
    }
  </style>
</head>

<body>
  <div class="ambient" aria-hidden="true"></div>

  <main>
    <figure class="cover">
      <img
        src="randsone-web.jpg"
        alt="To kvinner sit med avstand mellom seg på ein benk ved eit stille skogsvatn."
        width="1116"
        height="1059"
      >
    </figure>

    <section class="letter" aria-label="Helsing frå forfattaren">
      <p class="eyebrow">Til lesaren</p>
      <p class="opening">Takk for at du tok deg tid til å lese Randsone. Eg håpar boka gav deg eit lite pusterom.</p>
      <p class="wish">Måtte fred og kjærleik følgje deg på vegen.</p>
      <p class="signature">
        Med hjerteleg helsing
        <span class="name">Øyvind</span>
      </p>
    </section>
  </main>

  <footer>Øyvind Løkling · Randsone</footer>
</body>
</html>
