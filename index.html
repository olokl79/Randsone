<!doctype html>
<html lang="nn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ei helsing frå Øyvind Løkling til lesaren av Randsone.">
  <title>Randsone</title>

  <style>
    :root {
      --paper: #f3efe6;
      --ink: #2e3133;
      --muted: #6b6d6d;
      --line: rgba(46, 49, 51, 0.18);
      --shadow: 0 24px 70px rgba(24, 26, 27, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.72), transparent 46rem),
        var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.7;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100% - 2rem, 820px);
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 5rem) 0 clamp(3rem, 8vw, 7rem);
    }

    .title {
      margin: 0 0 clamp(1.5rem, 4vw, 2.75rem);
      text-align: center;
      font-size: clamp(2rem, 7vw, 4.5rem);
      font-weight: 400;
      letter-spacing: 0.24em;
      line-height: 1.05;
      text-transform: uppercase;
    }

    figure {
      margin: 0;
    }

    .hero {
      display: block;
      width: 100%;
      height: auto;
      max-height: 68vh;
      object-fit: cover;
      object-position: center;
      border-radius: 2px;
      box-shadow: var(--shadow);
    }

    .rule {
      width: 5rem;
      height: 1px;
      margin: clamp(2.75rem, 7vw, 5rem) auto;
      background: var(--line);
    }

    .message {
      max-width: 34rem;
      margin: 0 auto;
      text-align: center;
      font-size: clamp(1.15rem, 2.5vw, 1.45rem);
    }

    .message p {
      margin: 0 0 1.35rem;
    }

    .message .opening {
      font-size: 1.08em;
    }

    .signature {
      margin-top: 2.75rem;
      color: var(--muted);
      font-size: 0.98em;
    }

    .name {
      display: block;
      margin-top: 0.35rem;
      color: var(--ink);
      font-style: italic;
    }

    footer {
      margin-top: clamp(4rem, 9vw, 7rem);
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
    }

    @media (max-width: 560px) {
      main {
        width: min(100% - 1.25rem, 820px);
        padding-top: 1.4rem;
      }

      .title {
        letter-spacing: 0.16em;
      }

      .hero {
        max-height: 62vh;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      main {
        animation: fade-in 900ms ease-out both;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }
  </style>
</head>

<body>
  <main>

    <figure>
      <img
        class="hero"
        src="randsone.jpg"
        alt="To kvinner sit med avstand mellom seg på ein benk ved eit stille skogsvatn."
        width="1800"
        height="2700"
      >
    </figure>

    <div class="rule" aria-hidden="true"></div>

    <section class="message" aria-label="Helsing frå forfattaren">
      <p class="opening">Takk for at du tok deg tid til å lese Randsone.
        Eg håpar boka gav deg eit lite pusterom</p>

      <p>Og husk; eg er veldig glad i deg.</p>

      <p>Måtte fred og kjærleik følgje deg på vegen.</p>

      <p class="signature">
        Med beste helsing
        <span class="name">Øyvind</span>
      </p>
    </section>

  </main>
</body>
</html>
